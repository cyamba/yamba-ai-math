<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><rect width="1200" height="700" fill="#f8f5ed"/><g font-family="DejaVu Sans, sans-serif"><text x="54" y="55" fill="#087f80" font-size="16" font-weight="700" text-anchor="start">03  /  AN EXACT OBSTRUCTION</text><text x="54" y="103" fill="#14293b" font-size="34" font-weight="700" text-anchor="start">A recurrence must allow particle counts to change</text><text x="54" y="137" fill="#536777" font-size="20" font-weight="400" text-anchor="start">At weight 8, the n = 0 row cannot preserve the number of colored particles.</text><rect x="54" y="178" width="503" height="376" rx="17" fill="#ffffff" stroke="#d7e2df" stroke-width="1.5"/><rect x="643" y="178" width="503" height="376" rx="17" fill="#ffffff" stroke="#d7e2df" stroke-width="1.5"/><text x="78" y="217" fill="#087f80" font-size="17" font-weight="700" text-anchor="start">SOURCE  C₀</text><text x="78" y="258" fill="#14293b" font-size="22" font-weight="600" text-anchor="start">Two objects of weight 8</text><rect x="78" y="282" width="454" height="88" rx="17" fill="#edf6f3" stroke="#d7e2df" stroke-width="1.5"/><text x="99" y="319" fill="#14293b" font-size="21" font-weight="400" text-anchor="start">β₀(0)  +  common part 3</text><text x="99" y="350" fill="#536777" font-size="18" font-weight="400" text-anchor="start">5 + 3 = 8    ·    1 colored particle</text><rect x="78" y="388" width="454" height="88" rx="17" fill="#f8f5ed" stroke="#d7e2df" stroke-width="1.5"/><text x="99" y="425" fill="#14293b" font-size="21" font-weight="400" text-anchor="start">α₀(0)  +  α₀(0)</text><text x="99" y="456" fill="#536777" font-size="18" font-weight="400" text-anchor="start">4 + 4 = 8    ·    2 colored particles</text><text x="667" y="217" fill="#087f80" font-size="17" font-weight="700" text-anchor="start">TARGET BRANCHES</text><text x="667" y="258" fill="#14293b" font-size="22" font-weight="600" text-anchor="start">Two objects of weight 8</text><rect x="667" y="282" width="454" height="88" rx="17" fill="#edf6f3" stroke="#d7e2df" stroke-width="1.5"/><text x="688" y="319" fill="#14293b" font-size="21" font-weight="400" text-anchor="start">A₁:  β₁(0) + β₁(0)</text><text x="688" y="350" fill="#536777" font-size="18" font-weight="400" text-anchor="start">4 + 4 = 8    ·    2 colored particles</text><rect x="667" y="388" width="454" height="88" rx="17" fill="#fceee9" stroke="#f1cbc2" stroke-width="1.5"/><text x="688" y="425" fill="#14293b" font-size="21" font-weight="400" text-anchor="start">q⁸ A₂:  empty object</text><text x="688" y="456" fill="#536777" font-size="18" font-weight="400" text-anchor="start">8 + 0 = 8    ·    0 colored particles</text><text x="895" y="512" fill="#536777" font-size="17" font-weight="500" text-anchor="middle">Shifted C₁ branches: no weight-8 objects</text><text x="600" y="593" fill="#cc5b4d" font-size="23" font-weight="700" text-anchor="middle">No target has exactly one colored particle.</text></g></svg>