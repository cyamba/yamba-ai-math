<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><rect width="1200" height="700" fill="#f8f5ed"/><g font-family="DejaVu Sans, sans-serif"><text x="54" y="55" fill="#087f80" font-size="16" font-weight="700" text-anchor="start">04  /  EVIDENCE AND SCOPE</text><text x="54" y="103" fill="#14293b" font-size="34" font-weight="700" text-anchor="start">What is proved, checked, and still open</text><text x="54" y="137" fill="#536777" font-size="20" font-weight="400" text-anchor="start">The evidence has different roles; a computation or a partial certificate is not the full bijection.</text><rect x="54" y="166" width="1092" height="100" rx="13" fill="#ffffff" stroke="#d7e2df" stroke-width="1.5"/><rect x="54" y="166" width="9" height="100" rx="4" fill="#087f80"/><text x="82" y="204" fill="#087f80" font-size="20" font-weight="700" text-anchor="start">01</text><text x="134" y="198" fill="#087f80" font-size="16" font-weight="700" text-anchor="start">ALL-INDEX WRITTEN THEOREM</text><text x="134" y="228" fill="#14293b" font-size="22" font-weight="700" text-anchor="start">Positive cut-word models and sign cancellation</text><text x="134" y="252" fill="#536777" font-size="17" font-weight="400" text-anchor="start">Written construction for every auxiliary index.</text><rect x="54" y="285" width="1092" height="100" rx="13" fill="#ffffff" stroke="#d7e2df" stroke-width="1.5"/><rect x="54" y="285" width="9" height="100" rx="4" fill="#087f80"/><text x="82" y="323" fill="#087f80" font-size="20" font-weight="700" text-anchor="start">02</text><text x="134" y="317" fill="#087f80" font-size="16" font-weight="700" text-anchor="start">SELECTED LEAN LEMMAS</text><text x="134" y="347" fill="#14293b" font-size="22" font-weight="700" text-anchor="start">Cancellation, blocks, entropy and merge bounds</text><text x="134" y="371" fill="#536777" font-size="17" font-weight="400" text-anchor="start">Checks selected universal components, not the full map.</text><rect x="54" y="404" width="1092" height="100" rx="13" fill="#ffffff" stroke="#d7e2df" stroke-width="1.5"/><rect x="54" y="404" width="9" height="100" rx="4" fill="#dba847"/><text x="82" y="442" fill="#dba847" font-size="20" font-weight="700" text-anchor="start">03</text><text x="134" y="436" fill="#dba847" font-size="16" font-weight="700" text-anchor="start">FINITE CHECKS</text><text x="134" y="466" fill="#14293b" font-size="22" font-weight="700" text-anchor="start">Independent bounded tests and coefficient checks</text><text x="134" y="490" fill="#536777" font-size="17" font-weight="400" text-anchor="start">Corroborate the implementations within stated bounds.</text><rect x="54" y="523" width="1092" height="100" rx="13" fill="#ffffff" stroke="#d7e2df" stroke-width="1.5"/><rect x="54" y="523" width="9" height="100" rx="4" fill="#cc5b4d"/><text x="82" y="561" fill="#cc5b4d" font-size="20" font-weight="700" text-anchor="start">04</text><text x="134" y="555" fill="#cc5b4d" font-size="16" font-weight="700" text-anchor="start">FULL KR1 BIJECTION</text><text x="134" y="585" fill="#14293b" font-size="22" font-weight="700" text-anchor="start">Product-to-gap algorithms and inverse proofs</text><text x="134" y="609" fill="#536777" font-size="17" font-weight="400" text-anchor="start">Open: object-level recurrence and coverage remain.</text></g></svg>