<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">A reversible move. A vanished pair.</title><desc id="desc">Inside a valid signed array, with b strictly below a in the partial order, an empty row over b,a is paired with a over b. Signs reverse and graph-inversion weight is unchanged.</desc><defs><radialGradient id="bg"><stop stop-color="#142642"/><stop offset="1" stop-color="#060a16"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="9"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bda6ff"/></marker></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="758" rx="28" fill="none" stroke="#314263"/><text x="72" y="66" font-family="sans-serif" font-size="16" fill="#67d9ed" text-anchor="start" letter-spacing="3">CHRISTOPHER YAMBA  /  YAMBA AI MATH</text><text x="72" y="120" font-family="Georgia, serif" font-size="40" fill="#e9edff" text-anchor="start" >A reversible move. A vanished pair.</text><text x="72" y="175" font-family="sans-serif" font-size="24" fill="#a1b0d6" text-anchor="start" >Local signed-array cancellation: b is below a in the partial order.</text><rect x="80" y="218" width="402" height="330" rx="24" fill="#080f20" stroke="#2c4260"/><rect x="718" y="218" width="402" height="330" rx="24" fill="#080f20" stroke="#2c4260"/><text x="123" y="274" font-family="sans-serif" font-size="42" fill="#67d9ed" text-anchor="start" >+</text><text x="760" y="274" font-family="sans-serif" font-size="42" fill="#fac779" text-anchor="start" >−</text><rect x="218" y="278" width="152" height="70" rx="10" fill="none" stroke="#7182a6" stroke-dasharray="7 8"/><text x="294" y="322" font-family="sans-serif" font-size="22" fill="#a1b0d6" text-anchor="middle" >empty</text><rect x="218" y="385" width="72" height="72" rx="12" fill="#67d9ed" fill-opacity=".1" stroke="#67d9ed" stroke-width="2"/><text x="254.0" y="433.24" font-family="sans-serif" font-size="32" fill="#67d9ed" text-anchor="middle" >b</text><rect x="298" y="385" width="72" height="72" rx="12" fill="#67d9ed" fill-opacity=".1" stroke="#67d9ed" stroke-width="2"/><text x="334.0" y="433.24" font-family="sans-serif" font-size="32" fill="#67d9ed" text-anchor="middle" >a</text><rect x="858" y="278" width="72" height="72" rx="12" fill="#fac779" fill-opacity=".1" stroke="#fac779" stroke-width="2"/><text x="894.0" y="326.24" font-family="sans-serif" font-size="32" fill="#fac779" text-anchor="middle" >a</text><rect x="858" y="385" width="72" height="72" rx="12" fill="#fac779" fill-opacity=".1" stroke="#fac779" stroke-width="2"/><text x="894.0" y="433.24" font-family="sans-serif" font-size="32" fill="#fac779" text-anchor="middle" >b</text><path d="M520 380H680" stroke="#bda6ff" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="600" y="344" font-family="sans-serif" font-size="18" fill="#bda6ff" text-anchor="middle" >repeat = return</text><text x="600" y="430" font-family="sans-serif" font-size="20" fill="#a1b0d6" text-anchor="middle" >same weight</text><text x="600" y="610" font-family="Georgia, serif" font-size="30" fill="#e9edff" text-anchor="middle" >Opposite signs. Equal powers of q.</text><text x="600" y="658" font-family="sans-serif" font-size="21" fill="#a1b0d6" text-anchor="middle" >All other rows are unchanged; the full proof controls the pivot.</text><text x="72" y="726" font-family="sans-serif" font-size="16" fill="#a1b0d6" text-anchor="start" >Exact diagram · Height-two formalization · 2026</text></svg>