<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Three beads. Two colors. One ascent each.</title><desc id="desc">The path has edges 1–2 and 2–3. Each of its two proper colorings using x and y has one ascent when x is less than y.</desc><defs><radialGradient id="bg"><stop stop-color="#142642"/><stop offset="1" stop-color="#060a16"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="9"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bda6ff"/></marker></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="758" rx="28" fill="none" stroke="#314263"/><text x="72" y="66" font-family="sans-serif" font-size="16" fill="#67d9ed" text-anchor="start" letter-spacing="3">CHRISTOPHER YAMBA  /  YAMBA AI MATH</text><text x="72" y="120" font-family="Georgia, serif" font-size="40" fill="#e9edff" text-anchor="start" >Three beads. Two colors. One ascent each.</text><text x="72" y="172" font-family="sans-serif" font-size="23" fill="#a1b0d6" text-anchor="start" >Neighboring beads differ. Color order: x &lt; y.</text><path d="M262 290H458 M542 290H738" stroke="#7080a3" stroke-width="4"/><path d="M285 228H435" stroke="#bda6ff" stroke-width="3" marker-end="url(#arrow)"/><text x="360.0" y="208" font-family="sans-serif" font-size="20" fill="#bda6ff" text-anchor="middle" >ascent</text><circle cx="220" cy="290" r="42" fill="#67d9ed" fill-opacity=".15" stroke="#67d9ed" stroke-width="3"/><text x="220" y="302" font-family="sans-serif" font-size="36" fill="#67d9ed" text-anchor="middle" >x</text><text x="220" y="369" font-family="sans-serif" font-size="20" fill="#a1b0d6" text-anchor="middle" >1</text><circle cx="500" cy="290" r="42" fill="#fac779" fill-opacity=".15" stroke="#fac779" stroke-width="3"/><text x="500" y="302" font-family="sans-serif" font-size="36" fill="#fac779" text-anchor="middle" >y</text><text x="500" y="369" font-family="sans-serif" font-size="20" fill="#a1b0d6" text-anchor="middle" >2</text><circle cx="780" cy="290" r="42" fill="#67d9ed" fill-opacity=".15" stroke="#67d9ed" stroke-width="3"/><text x="780" y="302" font-family="sans-serif" font-size="36" fill="#67d9ed" text-anchor="middle" >x</text><text x="780" y="369" font-family="sans-serif" font-size="20" fill="#a1b0d6" text-anchor="middle" >3</text><text x="920" y="302" font-family="Georgia, serif" font-size="34" fill="#e9edff" text-anchor="start" >q x²y</text><path d="M262 520H458 M542 520H738" stroke="#7080a3" stroke-width="4"/><path d="M565 458H715" stroke="#bda6ff" stroke-width="3" marker-end="url(#arrow)"/><text x="640.0" y="438" font-family="sans-serif" font-size="20" fill="#bda6ff" text-anchor="middle" >ascent</text><circle cx="220" cy="520" r="42" fill="#fac779" fill-opacity=".15" stroke="#fac779" stroke-width="3"/><text x="220" y="532" font-family="sans-serif" font-size="36" fill="#fac779" text-anchor="middle" >y</text><text x="220" y="599" font-family="sans-serif" font-size="20" fill="#a1b0d6" text-anchor="middle" >1</text><circle cx="500" cy="520" r="42" fill="#67d9ed" fill-opacity=".15" stroke="#67d9ed" stroke-width="3"/><text x="500" y="532" font-family="sans-serif" font-size="36" fill="#67d9ed" text-anchor="middle" >x</text><text x="500" y="599" font-family="sans-serif" font-size="20" fill="#a1b0d6" text-anchor="middle" >2</text><circle cx="780" cy="520" r="42" fill="#fac779" fill-opacity=".15" stroke="#fac779" stroke-width="3"/><text x="780" y="532" font-family="sans-serif" font-size="36" fill="#fac779" text-anchor="middle" >y</text><text x="780" y="599" font-family="sans-serif" font-size="20" fill="#a1b0d6" text-anchor="middle" >3</text><text x="920" y="532" font-family="Georgia, serif" font-size="34" fill="#e9edff" text-anchor="start" >q xy²</text><text x="600" y="670" font-family="Georgia, serif" font-size="36" fill="#e9edff" text-anchor="middle" >q(x²y + xy²) = q · xy · (x + y)</text><text x="72" y="726" font-family="sans-serif" font-size="16" fill="#a1b0d6" text-anchor="start" >Exact diagram · Height-two formalization · 2026</text></svg>